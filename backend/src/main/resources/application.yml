spring:
  application:
    name: mysterystay-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    # 256-bit base64/hex key default for local dev
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_MysteryStayDemoKey}
    key-secret: ${RAZORPAY_KEY_SECRET:MysteryStaySecretSandbox2026}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:MysteryStayWebhookSecret2026}
    currency: ${RAZORPAY_CURRENCY:USD}

