spring:
  datasource:
    url: jdbc:h2:mem:mysterystay_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.mysterystay: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
