# ==============================================================================
# Render Blueprint Specification for MysteryStay Backend
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: mysterystay-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: SERVER_PORT
        value: 8080
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://mysterystay.vercel.app,https://*.vercel.app,http://localhost:5173,http://localhost:3000
      - key: UPI_VPA
        value: 6302714896@mbk
      - key: UPI_PAYEE_NAME
        value: MysteryStay Prive
      - key: UPI_CURRENCY
        value: INR
      - key: UPI_USD_TO_INR
        value: 85.00
      - key: UPI_EXPIRY_MINUTES
        value: 15
      - key: RAZORPAY_KEY_ID
        value: rzp_test_MysteryStayDemoKey
      - key: RAZORPAY_KEY_SECRET
        value: MysteryStaySecretSandbox2026
      - key: RAZORPAY_WEBHOOK_SECRET
        value: MysteryStayWebhookSecret2026
      - key: RAZORPAY_CURRENCY
        value: USD
